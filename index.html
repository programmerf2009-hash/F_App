<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c1fa6"><title>F App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;--mut:rgba(226,230,255,.74);--line:rgba(255,255,255,.2);--gold:#FFD447;--bad:#ff9a9a;--ok:#7dffb3;font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(110,64,230,.8),rgba(110,64,230,0) 70%),radial-gradient(ellipse 60% 45% at 10% 95%,rgba(28,70,200,.85),rgba(28,70,200,0) 70%),radial-gradient(ellipse 55% 45% at 92% 70%,rgba(130,56,214,.6),rgba(130,56,214,0) 70%),linear-gradient(165deg,#3a22b6,#2b1fa4 50%,#1d2a98)}
.wave{position:fixed;left:-30%;width:160%;height:42vh;border-radius:50%;background:linear-gradient(180deg,rgba(170,140,255,.16),rgba(170,140,255,0));transform:rotate(-12deg);pointer-events:none}
#s{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;overflow:auto;display:flex;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));animation:in .5s ease}
.screen[hidden],[hidden]{display:none!important}
.screen>*{margin:auto}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.logo{display:block;width:54vw;max-width:280px;height:auto;filter:drop-shadow(0 10px 30px rgba(10,10,80,.45));user-select:none;-webkit-user-drag:none}
.col{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:clamp(26px,7vh,64px)}
.brand img{width:96px;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 22px rgba(10,10,80,.5))}
.brand b{font-size:clamp(36px,10vw,46px);font-weight:600;letter-spacing:.5px;text-shadow:0 4px 18px rgba(10,10,80,.45)}
.sm .brand{margin-bottom:20px}.sm .brand img{width:64px}.sm .brand b{font-size:30px}
.f{margin-bottom:14px}
label.t{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:0 0 6px 4px}
.in{position:relative}
.in>svg.ic{position:absolute;left:16px;top:50%;width:22px;height:22px;margin-top:-11px;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
input[type=text],input[type=password],input[type=number]{width:100%;height:58px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:400 17px inherit;font-family:inherit;padding:0 52px 0 18px;outline:0;transition:.2s;-moz-appearance:textfield}
.ico input{padding-left:52px}
input::placeholder{color:rgba(226,230,255,.5)}
input:focus-visible{border-color:#8fb8ff;box-shadow:0 0 0 3px rgba(120,160,255,.35);background:rgba(255,255,255,.12)}
input[aria-invalid=true]{border-color:var(--bad)}
.eye{position:absolute;right:6px;top:6px;width:46px;height:46px;border:0;border-radius:14px;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.eye svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eye .sl{display:none}.eye.on .sl{display:block}
.msg{min-height:18px;margin:6px 0 0 4px;font-size:13px;color:var(--mut)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.btn{width:100%;height:58px;border:0;border-radius:999px;font:600 18px inherit;font-family:inherit;color:#fff;cursor:pointer;transition:.2s}
.pri{background:linear-gradient(90deg,#5fb0ff,#6f6bff 60%,#7b55f5);box-shadow:0 10px 28px rgba(80,120,255,.4)}
.pri:hover{filter:brightness(1.08)}.btn:disabled{opacity:.65;cursor:wait}
.sec{background:rgba(70,80,200,.45);border:1px solid rgba(160,170,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:14px}
.sec:hover{background:rgba(80,92,220,.55)}
.link{display:block;margin:20px auto 0;background:none;border:0;color:var(--mut);font:400 16px inherit;font-family:inherit;cursor:pointer;padding:6px 10px}
.link:hover{color:#fff}
.btn:focus-visible,.link:focus-visible,.eye:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gen label{position:relative}
.gen input{position:absolute;opacity:0;inset:0}
.gen span{display:grid;place-items:center;height:58px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--mut);cursor:pointer;transition:.2s}
.gen input:checked+span{background:rgba(95,150,255,.35);border-color:#8fb8ff;color:#fff}
.gen input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.rules{list-style:none;margin:8px 0 0 4px;padding:0;font-size:13px;color:var(--mut)}
.rules li{margin:3px 0}.rules li::before{content:"○ "}.rules li.y{color:var(--ok)}.rules li.y::before{content:"✓ "}.rules li.n{color:var(--bad)}.rules li.n::before{content:"✗ "}
.note{margin:14px 4px 0;font-size:13px;line-height:1.45;color:var(--mut)}.note b{color:var(--gold);font-weight:500}
.demo{margin:22px 0 0;text-align:center;font-size:12px;line-height:1.45;color:rgba(226,230,255,.55)}
.home{text-align:center;max-width:320px}.home h1{margin:0 0 8px;font-size:28px;font-weight:600}.home p{margin:0 0 24px;color:var(--mut)}
@media (min-width:768px){.col{max-width:420px}.brand img{width:120px}.sm .brand img{width:76px}.logo{width:18vw;min-width:200px;max-width:300px}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}
</style></head><body>

<div class="f"><label class="t" for="rn">Nickname yarating</label><input id="rn" type="text" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="masalan: fayzillo_009" aria-describedby="rnm"><ul class="rules" id="rules"><li data-r="c">Faqat kichik harf, raqam, . va _</li><li data-r="l">Kamida 2 ta harf</li><li data-r="s">Kamida 1 ta . yoki _</li><li data-r="d">Kamida 2 ta raqam</li></ul><div class="msg" id="rnm" aria-live="polite"></div></div>
<div class="f"><label class="t" for="rp">Parol yarating</label><div class="in"><input id="rp" type="password" autocomplete="new-password" placeholder="Kamida 8 ta belgi"><button type="button" class="eye" data-eye="rp" aria-label="Parolni ko’rsatish"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button></div><div class="msg" id="rpm" aria-live="polite">Harf, raqam yoki belgi, kamida 8 ta</div></div>
<button class="btn pri" id="rb" type="submit">Akkaunt yaratish</button>
<p class="note"><b>Muhim:</b> parolni unutsangiz, uni tiklab bo’lmaydi.</p>
</form>
<button class="link" id="go-login" type="button">← Kirishga qaytish</button>
</section>

<p class="demo">Demo rejim: ma’lumotlar faqat shu qurilmada saqlanadi, haqiqiy server ulanmagan.</p>
</div></main>

<main class="screen" id="home" hidden><section class="home"><div class="brand" style="margin-bottom:18px"><img class="mark" alt="" src=""></div><h1 id="hi"></h1><p id="hs"></p><button class="btn pri" id="out" type="button">Chiqish</button></section></main>

<script>
(function(){
var c=document.getElementById('s'),x=c.getContext('2d'),st=[],W,H,D,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function init(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);var n=Math.round(W*H/2600);st=[];for(var i=0;i<n;i++){var b=Math.random()<.06;st.push({x:Math.random()*W,y:Math.random()*H,r:b?1.4+Math.random()*1.2:.3+Math.random()*.9,p:Math.random()*6.28,s:.4+Math.random()*1.2,b:b})}draw(0)}
function draw(t){x.clearRect(0,0,W,H);for(var i=0;i<st.length;i++){var a=st[i],o=.35+.65*(.5+.5*Math.sin(a.p+t*.001*a.s));if(a.b){var g=x.createRadialGradient(a.x,a.y,0,a.x,a.y,a.r*5);g.addColorStop(0,'rgba(255,255,255,'+o+')');g.addColorStop(1,'rgba(180,190,255,0)');x.fillStyle=g;x.beginPath();x.arc(a.x,a.y,a.r*5,0,6.283);x.fill()}else{x.fillStyle='rgba(255,255,255,'+o*.85+')';x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill()}}if(!still)requestAnimationFrame(draw)}
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(init,150)});init();if(!still)requestAnimationFrame(draw);
})();

var $=function(s){return document.querySelector(s)};
document.querySelectorAll('.mark').forEach(function(i){i.src=$('.logo').src});
var KU='fapp_demo_users',KS='fapp_session';
function rd(){try{return JSON.parse(localStorage.getItem(KU))||{}}catch(e){return {}}}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
var enc=new TextEncoder();
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function kdf(p,salt){var k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256))}

/* ---- Servis qatlami: haqiqiy backend (masalan Supabase) ulanganda faqat shu obyekt almashtiriladi ---- */
var api={
 available:async function(n){await wait(350);return !rd()[n]},
 register:async function(prof,n,p){await wait(500);var u=rd();if(u[n])throw new Error('taken');var s=crypto.getRandomValues(new Uint8Array(16));u[n]={salt:b64(s),hash:await kdf(p,s),profile:prof,at:Date.now()};localStorage.setItem(KU,JSON.stringify(u));localStorage.setItem(KS,n)},
 login:async function(n,p){await wait(500);var r=rd()[n];if(!r||await kdf(p,unb64(r.salt))!==r.hash)throw new Error('bad');localStorage.setItem(KS,n)},
 profile:function(n){var r=rd()[n];return r&&r.profile},
 session:function(){try{return localStorage.getItem(KS)}catch(e){return null}},
 logout:function(){try{localStorage.removeItem(KS)}catch(e){}}
};

function show(id){['splash','auth','home'].forEach(function(i){$('#'+i).hidden=i!==id})}
function view(reg){$('#v-login').hidden=reg;$('#v-reg').hidden=!reg;$('#auth').scrollTop=0}
function enter(n,guest){var p=!guest&&api.profile(n);$('#hi').textContent='Salom, '+(guest?'Mehmon':(p&&p.first)||'@'+n);$('#hs').textContent=guest?'Mehmon rejimi: ma’lumotlar saqlanmaydi.':'@'+n+' · akkauntingiz tayyor.';show('home')}
function say(el,t,k){el.textContent=t;el.className='msg'+(k?' '+k:'')}
function bad(i,f){i.setAttribute('aria-invalid',f?'true':'false')}
$('#go-reg').onclick=function(){view(true)};$('#go-login').onclick=function(){view(false)};
$('#guest').onclick=function(){enter(null,true)};
document.querySelectorAll('[data-eye]').forEach(function(b){b.onclick=function(){var i=document.getElementById(b.dataset.eye),h=i.type==='password';i.type=h?'text':'password';b.classList.toggle('on',h);b.setAttribute('aria-label',h?'Parolni yashirish':'Parolni ko’rsatish')}});
['ln','rn'].forEach(function(id){$('#'+id).addEventListener('input',function(e){e.target.value=e.target.value.toLowerCase().replace(/\s/g,'')})});

/* Nickname qoidalari */
function nick(v){var l=(v.match(/[a-z]/g)||[]).length,d=(v.match(/\d/g)||[]).length;return{c:/^[a-z0-9._]*$/.test(v),l:l>=2,s:/[._]/.test(v),d:d>=2}}
var tk=0,td;
$('#rn').addEventListener('input',function(){
 var v=this.value,r=nick(v),my=++tk,m=$('#rnm');clearTimeout(td);bad(this,false);say(m,'');
 document.querySelectorAll('#rules li').forEach(function(li){li.className=!v?'':(r[li.dataset.r]?'y':'n')});
 if(!v||!(r.c&&r.l&&r.s&&r.d))return;
 say(m,'Tekshirilmoqda…');
 td=setTimeout(async function(){try{var ok=await api.available(v);if(my!==tk)return;bad($('#rn'),!ok);say(m,ok?'✓ @'+v+' bo’sh':'✗ @'+v+' band, boshqasini tanlang',ok?'ok':'bad')}catch(e){if(my===tk)say(m,'Tekshirib bo’lmadi. Qayta urinib ko’ring','bad')}},400)});
$('#rp').addEventListener('input',function(){bad(this,false);var n=this.value.length;say($('#rpm'),!n?'Harf, raqam yoki belgi, kamida 8 ta':n<8?'Yana '+(8-n)+' ta belgi kerak':'✓ Parol yaroqli',!n?'':n<8?'bad':'ok')});

/* Ro’yxatdan o’tish */
var NAME=/^\p{L}[\p{L}'’ʻ-]{1,29}$/u;
$('#fr').addEventListener('submit',async function(e){e.preventDefault();
 var f=$('#rf').value.trim(),l=$('#rl').value.trim(),a=Number($('#ra').value),g=(document.querySelector('input[name=g]:checked')||{}).value,n=$('#rn').value,p=$('#rp').value,first=null;
 function err(inp,m,t){bad(inp,true);say($(m),t,'bad');first=first||inp}
 bad($('#rf'),false);bad($('#rl'),false);bad($('#ra'),false);say($('#rfm'),'');say($('#rlm'),'');say($('#ram'),'');say($('#rgm'),'');
 if(!NAME.test(f))err($('#rf'),'#rfm','Ismni kiriting');
 if(!NAME.test(l))err($('#rl'),'#rlm','Familyani kiriting');
 if(!Number.isInteger(a)||a<13||a>120)err($('#ra'),'#ram','Yosh 13 dan 120 gacha');
 if(!g){say($('#rgm'),'Jinsni tanlang','bad');first=first||document.querySelector('input[name=g]')}
 var r=nick(n);
 if(!(r.c&&r.l&&r.s&&r.d))err($('#rn'),'#rnm','Nickname qoidalarga mos emas');
 if(p.length<8)err($('#rp'),'#rpm','Parol kamida 8 ta belgidan iborat bo’lsin');
 if(first){first.focus();return}
 var btn=$('#rb');btn.disabled=true;btn.textContent='Yaratilmoqda…';
 try{await api.register({first:f,last:l,age:a,gender:g},n,p);enter(n);this.reset();document.querySelectorAll('#rules li').forEach(function(li){li.className=''});say($('#rnm'),'');say($('#rpm'),'Harf, raqam yoki belgi, kamida 8 ta')}
 catch(er){bad($('#rn'),true);say($('#rnm'),er.message==='taken'?'✗ @'+n+' band, boshqasini tanlang':'Xatolik yuz berdi. Qayta urinib ko’ring','bad')}
 btn.disabled=false;btn.textContent='Akkaunt yaratish'});

/* Kirish */
$('#fl').addEventListener('submit',async function(e){e.preventDefault();
 var n=$('#ln').value,p=$('#lp').value,m=$('#lm'),btn=$('#lb');
 if(!n||!p){bad($('#ln'),!n);bad($('#lp'),!p);say(m,'Nickname va parolni kiriting','bad');return}
 btn.disabled=true;btn.textContent='Tekshirilmoqda…';
 try{await api.login(n,p);say(m,'');bad($('#ln'),false);bad($('#lp'),false);this.reset();enter(n)}
 catch(er){bad($('#ln'),true);bad($('#lp'),true);say(m,'Nickname yoki parol noto’g’ri','bad')}
 btn.disabled=false;btn.textContent='Kirish'});

$('#out').onclick=function(){api.logout();view(false);show('auth')};
setTimeout(function(){var n=api.session();n&&rd()[n]?enter(n):show('auth')},1800);
</script></body></html>
